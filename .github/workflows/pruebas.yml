# Task 19: on every PR to main, runs ruff (Python errors) and pytest, and the site tests.
name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.17.4

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Pytest
        run: pytest -q

  # The site (tests/web/): Playwright opens web/ on desktop and on phone and checks the
  # accessibility criteria with axe-core.
  pagina:
    name: Site tests
    # Playwright 1.56 does not have Chromium for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Site tests
        run: npx playwright test
