# Task 18: downloads the new FIRMS hot spots four times a day and pushes the result to main.
# It is the only workflow that pushes to main without a PR, and it only touches the generated
# data files.
name: Daily update

on:
  # The times follow the satellite passes over the peninsula (measured on the 2025-2026 hot spots,
  # UTC): VIIRS passes from 18:30 to 20:05 and from 6:50 to 8:30; MODIS, from 15:00 to 21:30 and
  # from 2:10 to 9:30. FIRMS publishes each hot spot less than 3 hours after the pass.
  #   23:23 UTC (17:23 in Mérida): the afternoon VIIRS pass, which sees most burns, is in.
  #    1:23 UTC (19:23 in Mérida): afternoon backup, and the afternoon MODIS pass.
  #   11:23 UTC ( 5:23 in Mérida): the night passes are in; the previous day is complete.
  #   14:23 UTC ( 8:23 in Mérida): morning backup.
  # GitHub delays or skips scheduled jobs on the hour, when it is under the most load;
  # hence minute 23, and four runs instead of one.
  # Running too often does no harm: each run asks from the last day it already has for each
  # satellite, does not repeat hot spots and pushes nothing if there are no changes.
  schedule:
    - cron: "23 1,11,14,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizacion-diaria
  cancel-in-progress: false

jobs:
  actualizar:
    name: Update data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download new hot spots
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python pipeline/actualizar_diario.py

      - name: Recompute
        run: python pipeline/correr_todo.py

      - name: Push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos_peninsula/focos_recientes.parquet salidas web/datos
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: daily update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
