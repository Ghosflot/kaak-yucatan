# Tarea 18: baja los focos nuevos de FIRMS cuatro veces al día y sube el resultado a main.
# Es el único que sube a main sin PR, y solo toca los archivos de datos generados.
name: Actualización diaria

on:
  # Las horas siguen el paso de los satélites por la península (medido en los focos de 2025-2026,
  # hora UTC): VIIRS pasa de 18:30 a 20:05 y de 6:50 a 8:30; MODIS, de 15:00 a 21:30 y de 2:10
  # a 9:30. FIRMS publica cada foco menos de 3 horas después del paso.
  #   23:23 UTC (17:23 en Mérida): ya está el paso de la tarde de VIIRS, que ve la mayoría de las quemas.
  #    1:23 UTC (19:23 en Mérida): respaldo de la tarde y el paso de la tarde de MODIS.
  #   11:23 UTC ( 5:23 en Mérida): ya están los pasos de la noche; el día anterior queda completo.
  #   14:23 UTC ( 8:23 en Mérida): respaldo de la mañana.
  # GitHub atrasa o se salta los trabajos programados a la hora en punto, cuando tiene más carga
  # (algunas corridas de las 13:00 salieron horas tarde), por eso el minuto 23 y cuatro corridas en lugar de una.
  # Correr de más no hace daño: cada corrida pide desde el último día que ya tiene cada satélite,
  # no repite focos y no sube nada si no hay cambios.
  schedule:
    - cron: "23 1,11,14,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizacion-diaria
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Bajar focos nuevos
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python pipeline/actualizar_diario.py

      - name: Recalcular
        run: python pipeline/correr_todo.py

      - name: Subir a main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos_peninsula/focos_recientes.parquet salidas web/datos
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "datos: actualización diaria $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
